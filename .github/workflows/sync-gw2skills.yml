name: Sync GW2Skills build data
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/builds.json'
      - 'data/roaming.json'
      - 'scripts/sync_gw2skills.py'
      - '.github/workflows/sync-gw2skills.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve GW2Skills links
        run: python scripts/sync_gw2skills.py
      - name: Verify generated class icons
        run: |
          test -s data/gw2-class-icons.json
          test -d assets/gw2/classes
          test "$(find assets/gw2/classes -type f | wc -l)" -gt 0
          echo "Generated $(find assets/gw2/classes -type f | wc -l) local class icon files"
      - name: Commit generated build data
        run: |
          git add data/gw2-build-codes.json data/gw2-item-cache.json data/gw2-mechanics-debug.json data/gw2-class-icons.json assets/gw2/items assets/gw2/classes
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync GW2Skills build data [skip ci]"
          git push
