name: Sync GW2Skills build data
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/builds.json'
      - 'scripts/sync_gw2skills.py'
      - '.github/workflows/sync-gw2skills.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve GW2Skills links
        run: |
          echo "Before: $(sha256sum data/gw2-build-codes.json 2>/dev/null || echo missing)"
          python scripts/sync_gw2skills.py
          echo "After:  $(sha256sum data/gw2-build-codes.json)"
          python - <<'PY'
          import json
          d=json.load(open('data/gw2-build-codes.json',encoding='utf-8'))
          for bid in ('power-evoker','heal-evoker','power-amalgam'):
              e=d.get(bid,{})
              print(f"{bid}: mechanics={e.get('mechanics')!r}, sync_schema={e.get('sync_schema')!r}")
          PY
      - name: Commit generated build data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gw2-build-codes.json data/gw2-item-cache.json assets/gw2/items
          if [ -z "$(git status --porcelain -- data/gw2-build-codes.json data/gw2-item-cache.json assets/gw2/items)" ]; then
            echo "Sync completed, but generated files are identical to the repository."
            exit 0
          fi
          echo "Generated changes:"
          git status --short -- data/gw2-build-codes.json data/gw2-item-cache.json assets/gw2/items
          git commit -m "Sync GW2Skills build data [skip ci]"
          git push
