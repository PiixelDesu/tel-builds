name: Sync GW2Skills build data
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/builds.json'
      - 'scripts/sync_gw2skills.py'
      - '.github/workflows/sync-gw2skills.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve GW2Skills links
        run: python scripts/sync_gw2skills.py
      - name: Commit generated build data
        run: |
          if git diff --quiet -- data/gw2-build-codes.json data/gw2-item-cache.json assets/gw2/items; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gw2-build-codes.json data/gw2-item-cache.json data/gw2-mechanics-debug.json assets/gw2/items
          git commit -m "Sync GW2Skills build data [skip ci]"
          git push
